<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CLOT PRICE TRACKER — 관심 상품 가격 동향</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* Musinsa's restrained storefront, adapted for price research. */ :root {
  --bg:#fbfbfa;
  --fg:#111;
  --surface:#fff;
  --muted:#626262;
  --border:#eaeaea;
  --accent:#1768cf;
  --surface-2:#ebebeb;
  --hover:#e8e8e8;
  --press:#ddd;
  --fg-invert:#fff;
  --fg-hover:#333;
  --accent-ink:#145bb3;
  --accent-press:#10498f;
  --accent-soft:#edf3fb;
  --down:#14734a;
  --down-soft:#e8f3ed;
  --up:#c3332c;
  --up-soft:#faefee;
  --r:3px;
  --font:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --shadow:0 2px 8px rgb(0 0 0 / .04);
  --shadow-lg:0 16px 48px rgb(0 0 0 / .2)
}
[data-theme="dark"] {
  --bg:#171719;
  --fg:#f4f4f4;
  --surface:#232326;
  --muted:#adadb3;
  --border:#3d3d42;
  --accent:#83b5ff;
  --surface-2:#2b2b30;
  --hover:#323238;
  --press:#3d3d43;
  --fg-invert:#171719;
  --fg-hover:#ddd;
  --accent-ink:#83b5ff;
  --accent-press:#b1cfff;
  --accent-soft:#23354b;
  --down:#76d2a7;
  --down-soft:#223d30;
  --up:#ff938b;
  --up-soft:#462a2a;
  --shadow-lg:0 16px 48px rgb(0 0 0 / .5);
  color-scheme:dark
}
*,*::before,*::after {
  box-sizing:border-box
}
html {
  -webkit-text-size-adjust:100%;
  scrollbar-color:var(--muted) var(--bg)
}
body {
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:15px/1.6 var(--font);
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1
}
button,input,select {
  font:inherit;
  color:inherit
}
a {
  color:inherit;
  text-underline-offset:3px
}
button {
  cursor:pointer
}
input {
  caret-color:var(--fg)
}
::selection {
  background:var(--fg);
  color:var(--bg)
}
.num {
  font-variant-numeric:tabular-nums
}
:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:3px
}
[hidden] {
  display:none!important
}
.topbar {
  position:sticky;
  top:0;
  z-index:40;
  background:#1a1b1f;
  color:#fff
}
.topbar-in {
  max-width:1440px;
  margin:auto;
  padding:18px 28px;
  display:flex;
  align-items:center;
  gap:24px
}
.wordmark {
  display:flex;
  gap:14px;
  align-items:baseline;
  margin-right:auto
}
.wordmark b {
  font-size:30px;
  font-weight:900;
  letter-spacing:-.04em;
  line-height:1
}
.meta {
  font-size:12px;
  color:#c5c5c9
}
.meta b {
  color:#fff;
  font-weight:500
}
.topbar-actions {
  display:flex;
  gap:4px
}
.icon-btn {
  width:40px;
  height:40px;
  padding:10px;
  display:grid;
  place-items:center;
  background:transparent;
  color:inherit;
  border:1px solid #48484d;
  border-radius:2px
}
.icon-btn:hover {
  background:#34353b
}
.icon-btn svg {
  width:18px;
  height:18px
}
.shell {
  max-width:1440px;
  margin:auto;
  padding:0 28px 96px
}
.price-tabs {
  display:flex;
  gap:28px;
  border-bottom:1px solid var(--border);
  overflow-x:auto
}
.price-tabs .chip {
  border:0;
  border-radius:0;
  background:none;
  color:var(--muted);
  padding:12px 0;
  height:auto;
  min-height:48px;
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
  border-bottom:3px solid transparent
}
.price-tabs .chip[aria-pressed="true"] {
  background:none;
  color:var(--fg);
  border-bottom-color:var(--fg)
}
.toolbar {
  padding:20px 0 18px;
  display:flex;
  gap:14px 18px;
  align-items:center;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border)
}
.search {
  position:relative;
  min-width:0;
  flex:1 1 100%;
  order:-2
}
.search svg {
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  width:20px;
  height:20px;
  color:var(--muted);
  pointer-events:none
}
.search input {
  width:100%;
  height:48px;
  padding:0 48px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:2px;
  font-size:14px
}
.search input::placeholder {
  color:var(--muted)
}
.search input:focus {
  outline:2px solid var(--accent);
  outline-offset:1px
}
.cat-bar {
  display:flex;
  align-items:center;
  gap:18px;
  width:100%;
  order:-1;
  overflow-x:auto;
  scrollbar-width:thin;
  padding-bottom:8px;
  border-bottom:1px solid var(--border)
}
.cat-chip {
  display:inline-flex;
  gap:6px;
  align-items:center;
  flex:none;
  border:0;
  border-radius:0;
  background:none;
  padding:6px 0;
  min-height:40px;
  color:var(--muted);
  font-size:13px;
  font-weight:600
}
.cat-chip[aria-pressed="true"] {
  color:var(--fg);
  font-weight:800
}
.chips {
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap
}
.group-label {
  color:var(--muted);
  font-size:12px;
  margin-right:4px;
  white-space:nowrap
}
.chip {
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:40px;
  padding:6px 12px;
  border:1px solid var(--border);
  border-radius:2px;
  background:var(--surface);
  font-size:12px;
  font-weight:600
}
.chip:hover,.cat-chip:hover {
  background:var(--hover)
}
.chip[aria-pressed="true"] {
  background:var(--fg);
  border-color:var(--fg);
  color:var(--fg-invert)
}
.history-control {
  border:0;
  padding:6px 0;
  background:none;
  font-weight:400
}
.history-control input {
  accent-color:var(--fg);
  width:16px;
  height:16px
}
.brand-controls {
  display:flex;
  flex:1 1 240px;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  min-width:0
}
.brand-summary {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  min-width:0
}
.brand-summary .chip {
  max-width:220px;
  white-space:normal;
  overflow-wrap:anywhere
}
.sort {
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:auto
}
.sort label {
  font-size:12px;
  color:var(--muted)
}
.sort select {
  min-height:40px;
  max-width:100%;
  padding:6px 10px;
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:2px;
  font-size:12px
}
.resultbar {
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  padding:18px 0;
  font-size:12px;
  color:var(--muted)
}
.resultbar b {
  color:var(--fg)
}
.linkbtn {
  border:0;
  padding:6px 0;
  background:none;
  text-decoration:underline;
  font-size:12px;
  color:var(--accent-ink)
}
#activeFilters {
  flex:1;
  font-size:12px
}
.grid {
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:28px 12px
}
.card {
  appearance:none;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  text-align:left;
  padding:0;
  width:100%;
  min-width:0;
  background:transparent;
  color:var(--fg);
  border:0;
  border-radius:0;
  overflow:hidden
}
.card:hover .gname {
  text-decoration:underline;
  text-underline-offset:3px
}
.thumb {
  position:relative;
  aspect-ratio:5/6;
  overflow:hidden;
  background:var(--surface-2)
}
.thumb img {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover
}
.ph {
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  background:var(--surface-2);
  color:var(--muted);
  font-size:28px;
  font-weight:600
}
.card-body {
  padding:12px 0 0;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:3px;
  flex:1;
  overflow-wrap:anywhere
}
.brand {
  font-size:12px;
  font-weight:750
}
.gname {
  font-size:13px;
  line-height:1.5;
  min-height:3em;
  margin:0 0 6px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden
}
.priceline {
  display:flex;
  align-items:baseline;
  gap:8px;
  flex-wrap:wrap
}
.mine {
  font-size:17px;
  font-weight:800;
  letter-spacing:-.025em
}
.price-source {
  font-size:11px;
  line-height:1.55;
  color:var(--muted);
  margin-top:5px;
  text-decoration:none
}
.pins {
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  margin:5px 0
}
.pin {
  font-size:11px;
  font-weight:650;
  padding:3px 5px;
  line-height:1.4;
  border-radius:1px
}
.pin.low {
  color:var(--down);
  background:var(--down-soft)
}
.pin.drop {
  color:var(--up);
  background:var(--up-soft)
}
.pin.wait {
  color:var(--muted);
  background:var(--surface-2)
}
.tag-row {
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  margin-top:5px;
  order:1
}
.cat-tag {
  display:inline-block;
  padding:2px 5px;
  background:var(--surface-2);
  font-size:10px;
  color:var(--muted)
}
.soldout-veil {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  background:rgb(0 0 0 / .48);
  color:#fff;
  font-size:13px;
  font-weight:700
}
.card.out .mine {
  color:var(--muted)
}
.waitprice {
  font-size:13px;
  color:var(--muted)
}
.empty {
  grid-column:1/-1;
  padding:64px 20px;
  text-align:center;
  color:var(--muted);
  background:var(--surface)
}
.empty b {
  display:block;
  color:var(--fg);
  margin-bottom:8px
}
.more {
  display:block;
  margin:28px auto 0;
  min-height:44px;
  padding:8px 28px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:2px;
  font-size:13px;
  font-weight:600
}
#catalogNotice {
  font-size:12px;
  line-height:1.7;
  color:var(--muted);
  overflow-wrap:anywhere;
  margin:12px 0
}
.sheet-brand {
  font-size:13px;
  font-weight:700;
  letter-spacing:0.01em
}
.sheet-name {
  font-size:19px;
  font-weight:700;
  letter-spacing:-0.01em;
  line-height:1.35;
  margin:2px 0 4px
}
.sheet-no {
  font-size:11px;
  color:var(--muted);
  letter-spacing:0.02em
}
.sheet-price {
  display:flex;
  align-items:baseline;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap
}
.sheet-price .now {
  font-size:26px;
  font-weight:800;
  letter-spacing:-0.025em
}
.sheet-price .off {
  font-size:14px;
  font-weight:700;
  color:var(--up)
}
.sheet-price .base {
  font-size:12px;
  color:var(--muted);
  text-decoration:line-through
}
.sheet-facts {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:10px;
}
.fact {
  font-size:11px;
  font-weight:600;
  letter-spacing:0.01em;
  padding:5px 8px;
  border-radius:4px;
  background:var(--surface);
  color:var(--muted);
}
.fact b {
  color:var(--fg);
  font-weight:700
}
.fact.low {
  background:var(--down-soft);
  color:var(--down)
}
.fact.low b {
  color:var(--down)
}
.fact.out {
  background:var(--surface);
  color:var(--muted)
}
.cta {
  height:38px;
  padding:0 14px;
  border:0;
  border-radius:var(--r);
  cursor:pointer;
  background:var(--accent-ink);
  color:#ffffff;
  font-size:13px;
  font-weight:700;
  letter-spacing:0.02em;
  display:inline-flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
  text-decoration:none;
  transition:background .12s ease;
}
.cta:hover {
  background:var(--accent-press);
  color:#ffffff
}
[data-theme="dark"] .cta {
  color:oklch(0.175 0.008 258)
}
[data-theme="dark"] .cta:hover {
  color:oklch(0.175 0.008 258)
}
.sheet-bar {
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border);
}
.seg {
  display:inline-flex;
  background:var(--surface);
  border-radius:var(--r);
  padding:3px;
  gap:2px
}
.seg button {
  height:30px;
  padding:0 12px;
  border:0;
  background:none;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
  font-weight:700;
  letter-spacing:0.02em;
  color:var(--muted);
  transition:background .12s ease,color .12s ease;
}
.seg button:hover:not(:disabled) {
  background:var(--hover);
  color:var(--fg)
}
.seg button[aria-pressed="true"] {
  background:var(--bg);
  color:var(--fg);
  box-shadow:0 1px 2px oklch(0.18 0.01 258 / .12)
}
.seg button:disabled {
  opacity:.38;
  cursor:not-allowed
}
.stepper {
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:6px
}
.stepper .pos {
  font-size:12px;
  color:var(--muted);
  font-weight:600;
  min-width:66px;
  text-align:center
}
.step {
  width:32px;
  height:32px;
  border:1px solid var(--border);
  background:var(--bg);
  border-radius:var(--r);
  cursor:pointer;
  display:grid;
  place-items:center;
}
.step:hover:not(:disabled) {
  background:var(--hover);
  border-color:var(--muted)
}
.step:active:not(:disabled) {
  background:var(--press)
}
.step:disabled {
  opacity:.35;
  cursor:not-allowed
}
.step svg {
  width:14px;
  height:14px
}
.sheet-body {
  overflow-y:auto;
  flex:1;
  -webkit-overflow-scrolling:touch
}
.chart-wrap {
  padding:18px 20px 8px
}
.chart-box {
  position:relative;
  height:264px
}
.legend {
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  padding:10px 0 0;
  font-size:12px;
  color:var(--muted)
}
.legend i {
  display:inline-block;
  width:16px;
  height:0;
  border-top-width:2px;
  border-top-style:solid;
  vertical-align:middle;
  margin-right:6px
}
.legend .l-normal i {
  border-top-color:var(--muted);
  border-top-style:dashed;
  border-top-width:2px
}
.legend .l-sale i {
  border-top-color:var(--accent)
}
.legend .l-mine i {
  border-top-color:var(--down);
  border-top-width:3px
}
.legend .l-nb {
  display:none
}
.legend .l-nb i {
  border-top-color:var(--muted);
  border-top-width:1.5px
}
.is-4910 .legend .l-nb {
  display:inline
}
.chart-fallback {
  display:none;
  padding:40px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  background:var(--surface);
  border-radius:var(--r);
  margin:0;
}
.tbl-wrap {
  padding:20px
}
.tbl-title {
  font-size:13px;
  font-weight:700;
  letter-spacing:0.02em;
  margin-bottom:10px
}
table {
  width:100%;
  border-collapse:collapse;
  font-size:12px
}
th,td {
  padding:9px 10px;
  text-align:right;
  white-space:nowrap;
  border-bottom:1px solid var(--border)
}
th:first-child,td:first-child {
  text-align:left;
  padding-left:0
}
th:last-child,td:last-child {
  text-align:center;
  padding-right:0
}
thead th {
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  letter-spacing:0.03em;
  border-bottom:1px solid var(--fg);
}
tbody tr:last-child td {
  border-bottom:0
}
td.mine-c {
  font-weight:800;
  letter-spacing:-0.01em
}
.delta-down {
  color:var(--down);
  font-weight:700
}
.delta-up {
  color:var(--up);
  font-weight:700
}
.delta-flat {
  color:var(--muted)
}
.st {
  font-size:11px;
  font-weight:700;
  padding:3px 7px;
  border-radius:4px;
  background:var(--surface);
  color:var(--muted)
}
.st.on {
  background:var(--down-soft);
  color:var(--down)
}
.nb-col {
  display:none
}
.is-4910 .nb-col {
  display:table-cell
}
.brand-dialog {
  width:min(520px,calc(100% - 32px));
  max-height:calc(100dvh - 40px);
  padding:24px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--bg);
  color:var(--fg);
  box-shadow:0 8px 24px rgb(0 0 0 / .18)
}
.brand-dialog::backdrop {
  background:rgb(0 0 0 / .48)
}
.brand-dialog h2 {
  font-size:20px;
  margin:0
}
.brand-dialog-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:18px
}
.brand-dialog-head button {
  min-height:44px;
  padding:8px 14px
}
.brand-dialog .search {
  min-width:0;
  width:100%;
  margin-bottom:12px
}
.brand-options {
  max-height:50dvh;
  overflow:auto;
  overscroll-behavior:contain;
  scrollbar-color:var(--muted) var(--bg)
}
.brand-option {
  display:flex;
  gap:12px;
  align-items:center;
  min-height:48px;
  padding:8px 4px;
  border-bottom:1px solid var(--border);
  cursor:pointer
}
.brand-option input {
  width:18px;
  height:18px;
  flex:none;
  accent-color:var(--fg)
}
.brand-option span {
  flex:1;
  overflow-wrap:anywhere;
  min-width:0
}
.brand-option .num {
  flex:none;
  color:var(--muted)
}
.group-label {
  flex:none;
  white-space:nowrap;
  font-size:12px;
  font-weight:600;
  color:var(--muted);
  margin-right:2px
}
@media(max-width:1199px) {
  .grid {
    grid-template-columns:repeat(4,minmax(0,1fr))
  }
}
@media(max-width:899px) {
  .grid {
    grid-template-columns:repeat(3,minmax(0,1fr))
  }
  .meta {
    display:none
  }
}
@media(max-width:639px) {
  .topbar-in {
    padding:12px 16px;
    gap:12px
  }
  .wordmark b {
    font-size:26px
  }
  .icon-btn {
    width:44px;
    height:44px
  }
  .shell {
    padding:0 16px 64px
  }
  .price-tabs {
    gap:20px
  }
  .price-tabs .chip {
    font-size:13px;
    gap:5px
  }
  .toolbar {
    gap:12px;
    padding:16px 0
  }
  .search input {
    font-size:13px;
    padding:0 36px
  }
  .search svg {
    left:10px;
    width:17px
  }
  .cat-bar {
    gap:16px
  }
  .chips {
    max-width:100%;
    gap:5px
  }
  .chip {
    padding:6px 9px
  }
  .brand-controls {
    flex-basis:100%
  }
  .sort {
    margin-left:0
  }
  .resultbar {
    gap:8px
  }
  .grid {
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:24px 10px
  }
  .mine {
    font-size:16px
  }

/* Compact catalog; secondary controls stay available behind native disclosure. */
.sr-only {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
#catalogView>.search {margin:24px 0 12px}
#catalogFilters {border-bottom:1px solid var(--border);margin-bottom:20px}
#catalogFilters .toolbar {border:0;padding-top:0}
.filter-toggle {display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 8px;border:0;background:none;font-size:12px;font-weight:600}
#filterCount {color:var(--muted);font-weight:400}
#activeFilters {font-size:12px;color:var(--muted);margin:0 0 16px;overflow-wrap:anywhere}
.brand-controls {flex:1 1 160px}
.resultbar {min-height:56px;padding:8px 0 16px;gap:12px}
.resultbar>span:first-child {margin-right:auto}
.resultbar .sort {margin-left:0}
.resultbar .sort select {border:0;background:transparent;padding-right:0;font-size:12px;color:var(--fg)}
.disclosure {border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.disclosure>summary {display:flex;align-items:center;min-height:44px;cursor:pointer;list-style:none;color:var(--fg);font-weight:600}
.disclosure>summary::-webkit-details-marker {display:none}
.disclosure>summary::after {content:'+';margin-left:auto;font-size:18px;font-weight:400;color:var(--muted)}
.disclosure[open]>summary::after {content:'−'}
.disclosure p {max-width:70ch;margin:12px 0;overflow-wrap:anywhere}
#priceDetails {margin:16px 0 24px}
#priceDetails .fact {display:block;padding:4px 0;border:0;font-size:12px}
.point-estimate {line-height:1.6}
.compare-control {display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-height:44px}

@media(max-width:899px) {.meta {display:block;font-size:11px}}
@media(max-width:639px) {.topbar-in {gap:12px}.meta {font-size:10px}.meta b {display:block}.resultbar {padding-bottom:12px}}

.detail-page {padding-top:20px;min-height:70vh}

.detail-layout {display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.8fr);gap:32px 48px;align-items:start}
.detail-image {grid-column:1;grid-row:1;aspect-ratio:5/6;max-height:420px;width:100%;overflow:hidden;background:var(--surface-2)}
.detail-image img {width:100%;height:100%;object-fit:contain;display:block}
.detail-summary {grid-column:2;grid-row:1 / span 2;position:sticky;top:104px;min-width:0;overflow-wrap:anywhere}
.detail-summary .sheet-brand {font-size:15px;margin-bottom:10px}
.detail-summary .sheet-name {font-size:25px;line-height:1.45;letter-spacing:-.03em;font-weight:650;margin:0 0 8px}
.detail-summary .sheet-no {font-size:12px}

      { label: '정상가', hidden:!comparing, data: normals, borderColor: cMuted, borderWidth: 1.5, borderDash: [5, 4],
        pointRadius: 0, pointHoverRadius: 0, tension: 0, fill: false },
      { label: on4910 ? '4910 표시가' : '무신사 판매가', hidden:!comparing, data: sales, borderColor: cAcc, borderWidth: 2,
        pointRadius: 3, pointBackgroundColor: cAcc, pointBorderColor: cBg, pointBorderWidth: 1.5,
        pointHoverRadius: 5, tension: 0.1, fill: false },
      { label: '혜택 적용 가격', data: mines, borderColor: cDown, borderWidth: 3,
        tension: 0.1, fill: false,
        segment: { borderDash: function (c) { return (it.kind==='wide'&&rows[c.p1DataIndex][8]!=='DIRECT')||outs[c.p1DataIndex] ? [4, 4] : undefined; } },
        pointStyle: rows.map(function (r, i) { return outs[i] ? 'crossRot' : 'circle'; }),
        pointRadius: rows.map(function (r, i) { return outs[i] ? 5 : (i === lowIdx ? 6.5 : 3.5); }),
        pointBackgroundColor: rows.map(function (r, i) { return outs[i] ? cMuted : cDown; }),
        pointBorderColor: rows.map(function (r, i) { return outs[i] ? cMuted : cBg; }),
        pointBorderWidth: rows.map(function (r, i) { return outs[i] ? 2 : 2; }),
        pointHoverRadius: 7 }
    ];
    if (it.kind === 'liked') {
      datasets.push({ label: '쿠폰적용가(신규회원)', hidden:!comparing, data: newbies, borderColor: cMuted, borderWidth: 1.5,
        pointRadius: 2, pointBackgroundColor: cMuted, pointBorderWidth: 0,
        pointHoverRadius: 4, tension: 0.1, fill: false });
    }

    chart = new Chart(cv, {
      type: 'line',
      plugins: [lowestPin],
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: { duration: 260 },
        interaction: { mode: 'index', intersect: false },
        layout: { padding: { top: 30, right: 6, left: 0, bottom: 0 } },
        plugins: {
          legend: { display: false },
          lowestPin: { at: lowIdx < 0 ? null : lowIdx, val: it.lowMy, color: cDown, ink: cssVar('--fg-invert') },
          tooltip: {
            backgroundColor: cFg, titleColor: cBg, bodyColor: cBg,
            borderColor: cFg, borderWidth: 1, padding: 10, cornerRadius: 6,
            displayColors: true, boxWidth: 8, boxHeight: 8, usePointStyle: true,
            titleFont: { family: cssVar('--font'), weight: '700', size: 12 },
            bodyFont: { family: cssVar('--font'), size: 12 },
            callbacks: {
              title: function (t) {
                var i = t[0].dataIndex;
                return rows[i][0] + (outs[i] ? '  ·  품절' : '');
              },
              label: function (t) { return ' ' + (it.kind==='wide'&&t.datasetIndex===2?priceKind(rows[t.dataIndex][8]):t.dataset.label) + '  ' + won(t.parsed.y); }
            }
          }
        },
        scales: {
          x: { grid: { display: false }, border: { color: cBorder },
               ticks: { color: cMuted, font: { family: cssVar('--font'), size: 11 }, maxRotation: 0, autoSkipPadding: 16 } },
          y: { min: yMin, max: yMax, grid: { color: cBorder, drawTicks: false },
               border: { display: false },
               ticks: { color: cMuted, font: { family: cssVar('--font'), size: 11 }, padding: 8, maxTicksLimit: 6,
                        callback: function (v) { return (v / 10000).toFixed(v % 10000 === 0 ? 0 : 1) + '만'; } } }
        }
      }
    });

  }

  function fillTable(it) {
    var tb = document.getElementById('mRows');
    if (!it.tracked) {
      tb.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:28px 0">아직 관측 기록이 없습니다</td></tr>';
      return;
    }
    var rows = slice(it).slice().reverse();
    tb.innerHTML = rows.map(function (r, i) {
      var older = rows[i + 1];
      var sameBasis = !older || ((!is4910(it)&&it.kind!=='wide') || r[5] === older[5]);
      var d = (older && sameBasis && r[3] != null && older[3] != null) ? r[3] - older[3] : null;
      var dCell = d == null ? '<span class="delta-flat">—</span>'
        : d < 0 ? '<span class="delta-down num">↓ ' + Math.abs(d).toLocaleString('ko-KR') + '</span>'
        : d > 0 ? '<span class="delta-up num">↑ ' + d.toLocaleString('ko-KR') + '</span>'
        : '<span class="delta-flat">변동 없음</span>';
      var isLowRow = it.lowEligible && r[3] != null && it.lowMy != null && r[3] === it.lowMy && ((!is4910(it)&&it.kind!=='wide') || r[5] === it.couponName);
      return '<tr><td>' + r[0] + '</td>' +
        '<td class="mine-c num">' + won(r[3]) + (it.kind==='wide'?'<br><small>'+esc(priceKind(r[8]))+'</small>':'') + '</td>' +
        '<td>' + dCell + '</td>' +
        '<td class="num">' + won(r[2]) + '</td>' +
        '<td class="nb-col num">' + won(r.length > 7 ? r[7] : null) + '</td>' +
        '<td class="num" style="color:var(--muted)">' + won(r[1]) + '</td>' +
        '<td>' + (r[4] === 1
          ? '<span class="st">품절</span>'
          : is4910(it) && r[3] == null ? '<span class="st">가격 재검증 필요</span>'
          : isLowRow ? '<span class="st on">최저가</span>' : '<span class="st">판매중</span>') + '</td></tr>';
    }).join('');
  }

  /* ── 초기 렌더 + 딥링크 (기획 S9) ──────────────────────── */
  function measureHeader(){document.documentElement.style.setProperty('--topbar-height',document.querySelector('.topbar').getBoundingClientRect().height+'px');}
  measureHeader();
  if(window.ResizeObserver)new ResizeObserver(measureHeader).observe(document.querySelector('.topbar'));
  else window.addEventListener('resize',measureHeader);
  function refreshPrices() {
    if(document.hidden)return;
    if(detailActive){catalogDirty=true;if(modalItem)fillModal(modalItem);return;}
    render();
  }
  document.addEventListener('visibilitychange',refreshPrices);
  window.addEventListener('pageshow',function(e){if(e.persisted)refreshPrices();});
  setInterval(refreshPrices,60000);
  render();
  if(!isV2&&(state.src!=='musinsa'||D.catalog.musinsaCount>0))runtime.ensureCatalog();
  navigation.start();
  if(!new URLSearchParams(location.search).has('goods')&&D.targetGoodsNo)navigation.replace({key:String(D.targetGoodsNo)});
})();
</script>
</body>
</html>
