<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CLOT PRICE TRACKER — 관심 상품 가격 동향</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* ─── Toss design tokens ─────────────────────────────────────────── */
:root{
  --bg:#ffffff;
  --fg:#111111;
  --surface:#f7f8fa;
  --muted:#6b7280;
  --border:#d9dee7;
  --accent:#1677ff;

  /* derived (oklch) — hover/press surfaces */
  --surface-2:oklch(0.955 0.004 258);
  --hover:oklch(0.945 0.005 258);
  --press:oklch(0.910 0.007 258);
  --fg-invert:#ffffff;
  --fg-hover:oklch(0.310 0.008 258);
  --accent-ink:oklch(0.520 0.196 258);      /* 흰 텍스트를 얹거나 액센트 텍스트로 쓸 때 (5.67:1) */
  --accent-press:oklch(0.450 0.175 258);
  --accent-soft:oklch(0.955 0.028 258);

  /* derived (oklch) — semantic price states (not defined by the DS) */
  --down:oklch(0.530 0.135 162);          /* 하락 · 역대 최저가 — 흰 텍스트 4.82:1 */
  --down-soft:oklch(0.984 0.014 162);
  --up:oklch(0.575 0.190 22);             /* 상승 · 할인율 */
  --up-soft:oklch(0.965 0.026 22);

  --r:8px;
  --font:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px oklch(0.18 0.01 258 / .06),0 8px 24px oklch(0.18 0.01 258 / .08);
  --shadow-lg:0 12px 48px oklch(0.18 0.01 258 / .18);
}
[data-theme="dark"]{
  --bg:oklch(0.175 0.008 258);
  --fg:oklch(0.972 0.002 258);
  --surface:oklch(0.232 0.010 258);
  --muted:oklch(0.700 0.016 258);
  --border:oklch(0.318 0.012 258);
  --accent:oklch(0.720 0.150 258);

  --surface-2:oklch(0.268 0.011 258);
  --hover:oklch(0.300 0.012 258);
  --press:oklch(0.345 0.013 258);
  --fg-invert:oklch(0.175 0.008 258);
  --fg-hover:oklch(0.860 0.004 258);
  --accent-ink:oklch(0.720 0.150 258);
  --accent-press:oklch(0.830 0.115 258);
  --accent-soft:oklch(0.290 0.045 258);

  --down:oklch(0.760 0.150 162);
  --down-soft:oklch(0.300 0.055 162);
  --up:oklch(0.740 0.165 22);
  --up-soft:oklch(0.310 0.060 22);

  --shadow:0 1px 2px oklch(0 0 0 / .4),0 8px 24px oklch(0 0 0 / .45);
  --shadow-lg:0 12px 48px oklch(0 0 0 / .6);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1;
  overflow-x:hidden;
}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ─── 샘플 데이터 표기 ─── */
.smark{
  align-self:center;flex:none;
  font-size:10px;font-weight:700;letter-spacing:0.09em;
  padding:3px 6px;border-radius:4px;
  background:var(--fg);color:var(--fg-invert);
}
@media (max-width:640px){
}

/* ─── Header ─────────────────────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--border);
}
.topbar-in{
  max-width:1560px;margin:0 auto;padding:16px 24px;
  display:flex;align-items:center;gap:24px;flex-wrap:wrap;
}
.wordmark{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.wordmark b{
  font-size:19px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;
}
.wordmark span{font-size:12px;color:var(--muted);letter-spacing:0.08em}
.meta{font-size:13px;color:var(--muted);letter-spacing:0.01em}
.meta b{color:var(--fg);font-weight:600}

.topbar-actions{display:flex;gap:6px;flex:none}
.icon-btn{
  width:36px;height:36px;padding:0;border:1px solid var(--border);
  background:var(--bg);border-radius:var(--r);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .12s ease,border-color .12s ease;
}
.icon-btn:hover{background:var(--hover);border-color:var(--muted)}
.icon-btn:active{background:var(--press)}
.icon-btn svg{width:17px;height:17px;display:block}

/* ─── KPI ────────────────────────────────────────────────────────── */
.shell{max-width:1560px;margin:0 auto;padding:0 24px 96px}
.kpi{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin:24px 0 0;
}
.kpi-card{
  appearance:none;text-align:left;cursor:pointer;align-items:stretch;
  background:var(--surface);border:1px solid transparent;border-radius:var(--r);
  padding:16px;display:flex;flex-direction:column;gap:2px;
  transition:background .12s ease,border-color .12s ease;
}
.kpi-card:hover{background:var(--hover)}
.kpi-card:active{background:var(--press)}
.kpi-card[aria-pressed="true"]{border-color:var(--fg);background:var(--surface-2)}
.kpi-label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0.02em}
.kpi-val{font-size:30px;font-weight:800;letter-spacing:-0.02em;line-height:1.15}
.kpi-val small{font-size:14px;font-weight:600;letter-spacing:0;margin-left:2px;color:var(--muted)}
.kpi-card.is-down .kpi-val{color:var(--down)}
.kpi-card.is-out .kpi-val{color:var(--muted)}

/* ─── Toolbar ────────────────────────────────────────────────────── */
.toolbar{
  position:sticky;top:var(--topbar-height,69px);z-index:30;background:var(--bg);
  padding:20px 0 12px;margin-bottom:12px;
  border-bottom:1px solid var(--border);
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
}
.search{position:relative;flex:0 1 320px;min-width:220px}
.search svg{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--muted);pointer-events:none;
}
.search input{
  width:100%;height:40px;padding:0 44px 0 36px;
  background:var(--surface);border:1px solid transparent;border-radius:var(--r);
  font-size:14px;letter-spacing:0.01em;
}
.search input::placeholder{color:var(--muted)}
.search input:focus{background:var(--bg);border-color:var(--accent);outline:none}
.search kbd{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font:600 11px/1 var(--font);color:var(--muted);
  border:1px solid var(--border);border-radius:4px;padding:4px 6px;
}
.search input:focus ~ kbd{display:none}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  height:36px;padding:0 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--border);background:var(--bg);
  font-size:13px;font-weight:600;letter-spacing:0.01em;
  display:inline-flex;align-items:center;gap:6px;
  transition:background .12s ease,border-color .12s ease,color .12s ease;
}
.chip:hover{background:var(--hover);border-color:var(--muted)}
.chip:active{background:var(--press)}
.chip .c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--fg-invert)}
.chip[aria-pressed="true"] .c{color:var(--fg-invert);opacity:.72}
.chip[aria-pressed="true"]:hover{background:var(--fg-hover);border-color:var(--fg-hover)}
.b4910 .chip{height:30px;padding:0 11px;font-size:12px}
.b4910 .chip[data-state="error"]{border-color:var(--up);color:var(--up)}

/* ─── Category Tabs ──────────────────────────────────────────────── */
.cat-bar{
  width:100%;display:flex;gap:8px;flex-wrap:wrap;
  padding:0 0 14px;margin-bottom:4px;
  border-bottom:1px dashed var(--border);
}
.cat-chip{
  height:38px;padding:0 16px;border-radius:var(--r);cursor:pointer;
  border:1px solid var(--border);background:var(--surface);color:var(--fg);
  font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;
  transition:background .12s ease,border-color .12s ease,color .12s ease,box-shadow .12s ease;
}
.cat-chip:hover{background:var(--hover);border-color:var(--muted)}
.cat-chip:active{background:var(--press)}
.cat-chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--fg-invert);box-shadow:var(--shadow)}
.cat-chip[aria-pressed="true"] .c{color:var(--fg-invert);opacity:.85}
.cat-tag{
  display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.02em;
  padding:2px 6px;border-radius:4px;background:var(--surface);color:var(--muted);
  width:fit-content;margin-bottom:2px;
}
.tag-row{display:flex;gap:4px;flex-wrap:wrap}

.sort{margin-left:auto;display:flex;align-items:center;gap:8px}
.sort label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0.02em}
.sort select{
  height:36px;padding:0 32px 0 12px;border:1px solid var(--border);
  background:var(--bg);border-radius:var(--r);font-size:13px;font-weight:600;
  cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%236b7280' stroke-width='1.6'%3E%3Cpath d='M4 6.5 8 10.5 12 6.5'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:14px;
}
.sort select:hover{background-color:var(--hover);border-color:var(--muted)}

.resultbar{
  font-size:13px;color:var(--muted);letter-spacing:0.01em;
  padding:4px 0 16px;display:flex;align-items:center;gap:10px;
}
.resultbar b{color:var(--fg);font-weight:700}
.linkbtn{
  background:none;border:0;padding:0;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--accent-ink);
  text-underline-offset:3px;text-decoration:underline;
}
.linkbtn:hover{color:var(--accent-press)}

/* ─── Grid ───────────────────────────────────────────────────────── */
.grid{
  display:grid;gap:8px 8px;
  grid-template-columns:repeat(6,minmax(0,1fr));
}
.card{
  appearance:none;text-align:left;padding:0;cursor:pointer;width:100%;align-items:stretch;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;
  transition:border-color .12s ease,box-shadow .12s ease,transform .12s ease;
}
.card:hover{border-color:var(--fg);box-shadow:var(--shadow);transform:translateY(-2px)}
.card:active{transform:translateY(0)}
.thumb{
  position:relative;aspect-ratio:1/1;background:var(--surface);overflow:hidden;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:var(--surface);color:var(--muted);
  font-size:32px;font-weight:800;letter-spacing:0.04em;
}
.pins{position:absolute;z-index:2;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;max-width:calc(100% - 16px)}
.pin{
  font-size:11px;font-weight:700;letter-spacing:0.02em;
  padding:4px 7px;border-radius:4px;line-height:1.25;
  box-shadow:0 1px 3px oklch(0.18 0.01 258 / .22);
}
.pin.low{background:var(--down);color:var(--fg-invert)}
.pin.drop{background:var(--up);color:var(--fg-invert)}
.pin.wait{background:var(--surface);color:var(--muted);border:1px solid var(--border);box-shadow:none}
.soldout-veil{
  position:absolute;z-index:1;inset:0;background:oklch(0.18 0.01 258 / .52);
  display:flex;align-items:center;justify-content:center;
  color:#ffffff;font-size:13px;font-weight:700;letter-spacing:0.08em;
}
.card-body{padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.brand{font-size:12px;font-weight:700;letter-spacing:0.01em}
.gname{
  font-size:12px;color:var(--muted);line-height:1.45;margin:1px 0 8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:2.9em;
}
.priceline{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.rate{font-size:15px;font-weight:800;color:var(--up);letter-spacing:-0.01em}
.mine{font-size:16px;font-weight:800;letter-spacing:-0.02em}
.card.out .mine,.card.out .rate{color:var(--muted)}
.was{font-size:11px;color:var(--muted);text-decoration:line-through;margin-top:2px}
.was.nb{text-decoration:none}
.tag{
  display:inline-block;margin-top:7px;font-size:10px;font-weight:700;
  letter-spacing:0.03em;padding:3px 6px;border-radius:4px;
  background:var(--accent-soft);color:var(--accent-press);
}
[data-theme="dark"] .tag{color:var(--accent)}
.card.out .tag{background:var(--surface);color:var(--muted)}
.waitprice{font-size:13px;font-weight:600;color:var(--muted)}

.empty{
  grid-column:1/-1;padding:72px 24px;text-align:center;color:var(--muted);
  background:var(--surface);border-radius:var(--r);
}
.empty b{display:block;font-size:16px;color:var(--fg);margin-bottom:6px}
.empty button{margin-top:14px}
.more{
  display:block;margin:16px auto 0;padding:10px 18px;font:inherit;font-size:13px;font-weight:600;
  color:var(--fg);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;
}

/* ─── Modal ──────────────────────────────────────────────────────── */
.scrim{
  position:fixed;inset:0;z-index:60;background:oklch(0.18 0.01 258 / .5);
  display:none;align-items:center;justify-content:center;padding:24px;
  backdrop-filter:blur(2px);
}
.scrim.open{display:flex}
.sheet{
  background:var(--bg);border-radius:12px;box-shadow:var(--shadow-lg);
  width:min(860px,100%);max-height:min(880px,92vh);
  display:flex;flex-direction:column;overflow:hidden;
}
.sheet-head{
  padding:20px 20px 16px;border-bottom:1px solid var(--border);
  display:flex;gap:16px;align-items:flex-start;
}
.sheet-thumb{
  width:104px;height:104px;flex:none;border-radius:var(--r);overflow:hidden;
  background:var(--surface);
}
.sheet-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.sheet-thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:28px;font-weight:800}
.sheet-info{flex:1;min-width:0}
.sheet-brand{font-size:13px;font-weight:700;letter-spacing:0.01em}
.sheet-name{font-size:19px;font-weight:700;letter-spacing:-0.01em;line-height:1.35;margin:2px 0 4px}
.sheet-no{font-size:11px;color:var(--muted);letter-spacing:0.02em}
.sheet-price{display:flex;align-items:baseline;gap:8px;margin-top:10px;flex-wrap:wrap}
.sheet-price .now{font-size:26px;font-weight:800;letter-spacing:-0.025em}
.sheet-price .off{font-size:14px;font-weight:700;color:var(--up)}
.sheet-price .base{font-size:12px;color:var(--muted);text-decoration:line-through}
.sheet-facts{
  display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;
}
.fact{
  font-size:11px;font-weight:600;letter-spacing:0.01em;
  padding:5px 8px;border-radius:4px;background:var(--surface);color:var(--muted);
}
.fact b{color:var(--fg);font-weight:700}
.fact.low{background:var(--down-soft);color:var(--down)}
.fact.low b{color:var(--down)}
.fact.out{background:var(--surface);color:var(--muted)}

.sheet-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end;flex:none}
.close-x{
  width:34px;height:34px;border:1px solid var(--border);background:var(--bg);
  border-radius:var(--r);cursor:pointer;display:grid;place-items:center;
}
.close-x:hover{background:var(--hover);border-color:var(--muted)}
.close-x:active{background:var(--press)}
.close-x svg{width:15px;height:15px}
.cta{
  height:38px;padding:0 14px;border:0;border-radius:var(--r);cursor:pointer;
  background:var(--accent-ink);color:#ffffff;
  font-size:13px;font-weight:700;letter-spacing:0.02em;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  text-decoration:none;
  transition:background .12s ease;
}
.cta:hover{background:var(--accent-press);color:#ffffff}
[data-theme="dark"] .cta{color:oklch(0.175 0.008 258)}
[data-theme="dark"] .cta:hover{color:oklch(0.175 0.008 258)}

.sheet-bar{
  padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--border);
}
.seg{display:inline-flex;background:var(--surface);border-radius:var(--r);padding:3px;gap:2px}
.seg button{
  height:30px;padding:0 12px;border:0;background:none;border-radius:6px;cursor:pointer;
  font-size:12px;font-weight:700;letter-spacing:0.02em;color:var(--muted);
  transition:background .12s ease,color .12s ease;
}
.seg button:hover:not(:disabled){background:var(--hover);color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px oklch(0.18 0.01 258 / .12)}
.seg button:disabled{opacity:.38;cursor:not-allowed}
.stepper{margin-left:auto;display:flex;align-items:center;gap:6px}
.stepper .pos{font-size:12px;color:var(--muted);font-weight:600;min-width:66px;text-align:center}
.step{
  width:32px;height:32px;border:1px solid var(--border);background:var(--bg);
  border-radius:var(--r);cursor:pointer;display:grid;place-items:center;
}
.step:hover:not(:disabled){background:var(--hover);border-color:var(--muted)}
.step:active:not(:disabled){background:var(--press)}
.step:disabled{opacity:.35;cursor:not-allowed}
.step svg{width:14px;height:14px}

.sheet-body{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.chart-wrap{padding:18px 20px 8px}
.chart-box{position:relative;height:264px}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:10px 0 0;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:0;border-top-width:2px;border-top-style:solid;vertical-align:middle;margin-right:6px}
.legend .l-normal i{border-top-color:var(--muted);border-top-style:dashed;border-top-width:2px}
.legend .l-sale i{border-top-color:var(--accent)}
.legend .l-mine i{border-top-color:var(--down);border-top-width:3px}
.legend .l-nb{display:none}
.legend .l-nb i{border-top-color:var(--muted);border-top-width:1.5px}
.is-4910 .legend .l-nb{display:inline}
.chart-fallback{
  display:none;padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;
  background:var(--surface);border-radius:var(--r);margin:0 20px;
}

.tbl-wrap{padding:20px}
.tbl-title{font-size:13px;font-weight:700;letter-spacing:0.02em;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{text-align:center;padding-right:0}
thead th{
  font-size:11px;font-weight:700;color:var(--muted);letter-spacing:0.03em;
  border-bottom:1px solid var(--fg);
}
tbody tr:last-child td{border-bottom:0}
td.mine-c{font-weight:800;letter-spacing:-0.01em}
.delta-down{color:var(--down);font-weight:700}
.delta-up{color:var(--up);font-weight:700}
.delta-flat{color:var(--muted)}
.st{font-size:11px;font-weight:700;padding:3px 7px;border-radius:4px;background:var(--surface);color:var(--muted)}
.st.on{background:var(--down-soft);color:var(--down)}
.nb-col{display:none}
.is-4910 .nb-col{display:table-cell}

/* ─── Responsive ─────────────────────────────────────────────────── */
@media (max-width:1400px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:1120px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:900px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi{grid-template-columns:repeat(2,1fr)}
  .sort{margin-left:0}
}
@media (max-width:640px){
  body{font-size:14px}
  .shell{padding:0 16px 80px}
  .topbar-in{padding:12px 16px;gap:12px}
  .icon-btn{width:44px;height:44px}
  .icon-btn svg{width:19px;height:19px}
  .wordmark b{font-size:16px}
  .meta{font-size:11px;flex-basis:100%;order:3}
  .toolbar{top:var(--topbar-height,61px);padding:16px 0 10px}
  .search{flex:1 1 100%}
  .search kbd{display:none}
  .cat-bar{overflow-x:auto;flex-wrap:nowrap;padding-bottom:8px;scrollbar-width:none}
  .cat-bar::-webkit-scrollbar{display:none}
  .cat-chip{flex:none}
  .chips{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi-val{font-size:24px}

  /* U12 — bottom sheet on mobile */
  .scrim{padding:0;align-items:flex-end}
  .sheet{
    width:100%;max-height:94vh;border-radius:16px 16px 0 0;
    animation:rise .22s cubic-bezier(.32,.72,0,1);
  }
  @keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-head{padding:16px;gap:12px;flex-wrap:wrap}
  .sheet-thumb{width:76px;height:76px}
  .sheet-name{font-size:16px}
  .sheet-actions{position:absolute;right:16px;top:16px}
  .sheet-actions .cta{display:none}
  .sheet-head::after{
    content:"";position:absolute;left:50%;top:7px;transform:translateX(-50%);
    width:36px;height:4px;border-radius:2px;background:var(--border);
  }
  .sheet-head{position:relative;padding-top:22px}
  .cta-mobile{display:flex !important;margin:0 16px 16px}
  .sheet-bar{padding:12px 16px}
  .chart-wrap{padding:14px 16px 4px}
  .chart-box{height:210px}
  .tbl-wrap{padding:16px;overflow-x:auto}
  table{min-width:520px}
}
.cta-mobile{display:none}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* Boolean hidden must win over chip/flex layout rules. */
[hidden]{display:none!important}
.brand-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%}
.brand-summary{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.brand-summary .chip{max-width:220px;white-space:normal;overflow-wrap:anywhere;min-height:40px}
.brand-summary button{cursor:pointer}
.brand-dialog{width:min(520px,calc(100% - 32px));max-height:calc(100dvh - 40px);padding:24px;border:1px solid var(--border);border-radius:16px;background:var(--bg);color:var(--text);box-shadow:0 8px 24px rgb(0 0 0 / .18)}
.brand-dialog::backdrop{background:rgb(0 0 0 / .48)}
.brand-dialog h2{font-size:20px;margin:0}
.brand-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand-dialog-head button{min-height:44px;padding:8px 14px}
.brand-dialog .search{min-width:0;width:100%;margin-bottom:12px}
.brand-options{max-height:50dvh;overflow:auto;overscroll-behavior:contain;scrollbar-color:var(--muted) var(--bg)}
.brand-option{display:flex;gap:12px;align-items:center;min-height:48px;padding:8px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.brand-option input{width:18px;height:18px;flex:none;accent-color:var(--text)}
.brand-option span{flex:1;overflow-wrap:anywhere;min-width:0}
.brand-option .num{flex:none;color:var(--muted)}
.group-label{font-size:12px;font-weight:600;color:var(--muted);margin-right:2px}
#catalogNotice{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
@media(max-width:640px){
 .brand-dialog{width:100%;max-width:none;max-height:85dvh;margin:auto 0 0;padding:20px 16px;border-radius:18px 18px 0 0}
 .brand-options{max-height:55dvh}
 .resultbar{gap:12px;align-items:flex-start}
}
</style>
</head>
<body>


<header class="topbar" data-od-id="topbar">
  <div class="topbar-in">
    <div class="wordmark" data-od-id="wordmark">
      <b>CLOT</b><span>PRICE TRACKER</span>
    </div>
    <div class="meta" data-od-id="last-run">
      마지막 수집 <b id="lastRun">—</b>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="reloadBtn" type="button" data-od-id="reload-button"
              aria-label="데이터 다시 불러오기" title="데이터 다시 불러오기">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13.67 4.76A6.4 6.4 0 1 1 7.30 4.20"/>
          <path d="M5.44 6.85L7.30 4.20L4.07 3.92"/>
        </svg>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" data-od-id="theme-toggle"
              aria-label="다크 모드 전환" title="다크 모드 전환">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path id="themeIcon" d="M16.5 12.4A7 7 0 0 1 7.6 3.5a7 7 0 1 0 8.9 8.9Z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="shell">

  <section class="kpi" data-od-id="kpi-row" aria-label="추적 요약 지표">
    <button class="kpi-card" type="button" data-filter="all" aria-pressed="true" data-od-id="kpi-total">
      <span class="kpi-label">전체 추적 상품</span>
      <span class="kpi-val num" id="kTotal">—</span>
    </button>
    <button class="kpi-card is-down" type="button" data-filter="lowest" aria-pressed="false" data-od-id="kpi-lowest">
      <span class="kpi-label">역대 최저가</span>
      <span class="kpi-val num" id="kLowest">—</span>
    </button>
    <button class="kpi-card is-down" type="button" data-filter="drop" aria-pressed="false" data-od-id="kpi-drop">
      <span class="kpi-label">어제보다 하락</span>
      <span class="kpi-val num" id="kDrop">—</span>
    </button>
    <button class="kpi-card is-out" type="button" data-filter="out" aria-pressed="false" data-od-id="kpi-soldout">
      <span class="kpi-label">품절</span>
      <span class="kpi-val num" id="kOut">—</span>
    </button>
  </section>

  <section class="toolbar" data-od-id="toolbar" aria-label="검색 및 필터">
    <div class="cat-bar" role="group" aria-label="카테고리 필터" data-od-id="category-bar">
      <button class="cat-chip" type="button" data-cat="all" aria-pressed="true" data-od-id="cat-all">전체 <span class="c num" id="cntAll">—</span></button>
      <button class="cat-chip" type="button" data-cat="top" aria-pressed="false" data-od-id="cat-top">상의 <span class="c num" id="cntTop">—</span></button>
      <button class="cat-chip" type="button" data-cat="outer" aria-pressed="false" data-od-id="cat-outer">아우터 <span class="c num" id="cntOuter">—</span></button>
      <button class="cat-chip" type="button" data-cat="bottom" aria-pressed="false" data-od-id="cat-bottom">바지 <span class="c num" id="cntBottom">—</span></button>
      <button class="cat-chip" type="button" data-cat="shoes" aria-pressed="false" data-od-id="cat-shoes">신발 <span class="c num" id="cntShoes">—</span></button>
      <button class="cat-chip" type="button" data-cat="bag" aria-pressed="false" data-od-id="cat-bag">가방·잡화 <span class="c num" id="cntBag">—</span></button>
      <button class="cat-chip" type="button" data-cat="etc" aria-pressed="false" hidden>기타 <span class="c num">0</span></button>
    </div>

    <div class="search">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.3 3.3"/>
      </svg>
      <input id="q" type="search" placeholder="브랜드 · 상품명 검색" autocomplete="off" aria-label="브랜드 또는 상품명 검색" data-od-id="search-input">
      <kbd>/</kbd>
    </div>

    <div class="chips" role="group" aria-label="출처 필터" data-od-id="source-chips"><span class="group-label">출처</span>
      <button class="chip" type="button" data-src="all" aria-pressed="true" data-od-id="src-all">전체 <span class="c num" id="sAll">—</span></button>
      <button class="chip" type="button" data-src="musinsa" aria-pressed="false" data-od-id="src-musinsa">무신사 <span class="c num" id="sMusinsa">—</span></button>
      <button class="chip" type="button" data-src="4910" aria-pressed="false" data-od-id="src-4910">4910 <span class="c num" id="s4910">—</span></button>
    </div>


    <div class="chips" role="group" aria-label="빠른 필터" data-od-id="filter-chips"><span class="group-label">가격·상태</span>
      <button class="chip" type="button" data-filter="all" aria-pressed="true" data-od-id="chip-all">전체 <span class="c num" id="cAll">—</span></button>
      <button class="chip" type="button" data-filter="lowest" aria-pressed="false" data-od-id="chip-lowest">최저가 <span class="c num" id="cLowest">—</span></button>
      <button class="chip" type="button" data-filter="drop" aria-pressed="false" data-od-id="chip-drop">하락 <span class="c num" id="cDrop">—</span></button>
      <button class="chip" type="button" data-filter="onsale" aria-pressed="false" data-od-id="chip-onsale">판매중 <span class="c num" id="cOnsale">—</span></button>
      <button class="chip" type="button" data-filter="out" aria-pressed="false" data-od-id="chip-out">품절 <span class="c num" id="cOut">—</span></button>
    </div>

    <div class="brand-controls">
      <button class="chip" id="brandTrigger" type="button" aria-haspopup="dialog">브랜드 선택</button>
      <span id="brandSummary" class="brand-summary" aria-label="선택한 브랜드"></span>
    </div>
    <div class="sort" data-od-id="sort-control">
      <label for="sortSel">정렬</label>
      <select id="sortSel" data-od-id="sort-select">
        <option value="category">카테고리순 (착장순)</option>
        <option value="rate">할인율 높은 순</option>
        <option value="priceAsc">실구매가 낮은 순</option>
        <option value="priceDesc">실구매가 높은 순</option>
        <option value="dropAmt">하락폭 큰 순</option>
        <option value="brand">브랜드명 순</option>
        <option value="new">최근 추가 순</option>
      </select>
    </div>
  </section>

  <div class="resultbar" data-od-id="result-count">
    <span>조건에 맞는 상품 <b id="shownN">—</b>개 · 현재 <b id="renderedN">0</b>개 표시</span>
    <button class="linkbtn" id="resetBtn" type="button" hidden>초기화</button>
  </div>

  <p id="catalogNotice" role="status" hidden></p>
  <section class="grid" id="grid" data-od-id="product-grid" aria-label="추적 상품 목록"></section>
  <button class="more" id="gridMore" type="button" hidden data-od-id="grid-more"></button>
</main>


<dialog id="brandDialog" class="brand-dialog" aria-labelledby="brandTitle">
  <div class="brand-dialog-head"><h2 id="brandTitle">브랜드 선택</h2><button class="chip" id="brandClose" type="button">닫기</button></div>
  <p style="color:var(--muted);font-size:13px">여러 브랜드를 선택할 수 있습니다. 선택하면 바로 반영됩니다.</p>
  <div class="search"><input id="brandSearch" type="search" aria-label="브랜드 찾기" placeholder="브랜드 찾기" autocomplete="off"></div>
  <div class="brand-options" id="brandOptions"></div>
</dialog>
<div class="scrim" id="scrim"  role="dialog" aria-modal="true" aria-labelledby="mName" data-od-id="detail-modal">
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <div class="sheet-thumb" id="mThumb"></div>
      <div class="sheet-info">
        <div class="sheet-brand" id="mBrand"></div>
        <h2 class="sheet-name" id="mName"></h2>
        <div class="sheet-no" id="mNo"></div>
        <div class="sheet-price" id="mPrice"></div>
        <div class="sheet-facts" id="mFacts"></div>
      </div>
      <div class="sheet-actions">
        <button class="close-x" id="closeBtn" type="button" aria-label="닫기 (ESC)">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m5.5 5.5 9 9m0-9-9 9"/></svg>
        </button>
        <a class="cta" id="mLink" href="#" target="_blank" rel="noopener noreferrer" data-od-id="modal-cta">무신사에서 보기 ↗</a>
      </div>
    </div>

    <div class="sheet-bar">
      <div class="seg" role="group" aria-label="기간 선택" data-od-id="period-tabs">
        <button type="button" data-range="0" aria-pressed="true">전체</button>
        <button type="button" data-range="30" aria-pressed="false">30일</button>
        <button type="button" data-range="14" aria-pressed="false">14일</button>
        <button type="button" data-range="7" aria-pressed="false">7일</button>
      </div>
      <div class="stepper" data-od-id="modal-stepper">
        <button class="step" id="prevBtn" type="button" aria-label="이전 상품 (←)">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5 6.5 10 12 15.5"/></svg>
        </button>
        <span class="pos num" id="mPos"></span>
        <button class="step" id="nextBtn" type="button" aria-label="다음 상품 (→)">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4.5 13.5 10 8 15.5"/></svg>
        </button>
      </div>
    </div>

    <div class="sheet-body">
      <a class="cta cta-mobile" id="mLinkMobile" href="#" target="_blank" rel="noopener noreferrer">무신사에서 보기 ↗</a>
      <div class="chart-wrap">
        <div class="chart-box"><canvas id="chart"></canvas></div>
        <div class="chart-fallback" id="chartFallback">차트를 불러오지 못했습니다</div>
        <div class="legend">
          <span class="l-normal"><i></i>정상가</span>
          <span class="l-sale"><i></i>판매가</span>
          <span class="l-mine"><i></i>나의 실구매가</span>
          <span class="l-nb"><i></i>쿠폰적용가(신규회원 기준)</span>
        </div>
      </div>
      <div class="tbl-wrap">
        <div class="tbl-title">가격 변동 기록</div>
        <table data-od-id="history-table">
          <thead><tr>
            <th scope="col">일자</th><th scope="col">나의 실구매가</th><th scope="col">직전 관측 대비</th>
            <th scope="col">판매가</th><th scope="col" class="nb-col">신규회원가</th><th scope="col">정상가</th><th scope="col">상태</th>
          </tr></thead>
          <tbody id="mRows"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
/* ══ 데이터 (빌드 시 인라인 주입 — file:// CORS 회피, 기획 S3) ══ */
/* __CLOT_DATA_PLACEHOLDER__ */ window.__CLOT_DATA__ = {};
(function () {
  'use strict';
  var D = window.__CLOT_DATA__;
  var IMG_BASE = 'https://image.msscdn.net';
  var LS = 'clot.';

  /* ── 유틸 ───────────────────────────────────────────────── */
  function won(n) { return (n == null ? '—' : n.toLocaleString('ko-KR') + '원'); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function md(d) { return d ? d.slice(5).replace('-', '.') : ''; }
  function imgUrl(p) { return !p ? '' : (/^https?:/.test(p) ? p : IMG_BASE + p); }
  function daysBetween(a, b) {
    return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
  }
  function cssVar(n) {
    return getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  }
  /* 샌드박스 iframe·file:// 에서는 localStorage / history 가 throw 할 수 있다 */
  function store(k, v) {
    try { if (v === undefined) return localStorage.getItem(LS + k); localStorage.setItem(LS + k, v); }
    catch (e) { return null; }
  }
  function setUrl(qs) {
    try { history.replaceState(null, '', location.pathname + (qs || '')); } catch (e) { /* opaque origin */ }
  }

  /* __CLOT_MODEL__ */
  /* __CLOT_RUNTIME__ */
  var model = window.__CLOT_MODEL__;
  function is4910(it) { return it.src === '4910'; }
  /* ── 헤더 · KPI · 칩 카운트 ─────────────────────────────── */
  var lastRunTxt = D.lastRun
    ? new Date(D.lastRun).toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
    : '—';
  document.getElementById('lastRun').textContent = lastRunTxt;


  var CAT_NAMES = { top: '상의', outer: '아우터', bottom: '바지', shoes: '신발', bag: '가방·잡화' };
  var CAT_ORDER = { top: 1, outer: 2, bottom: 3, shoes: 4, bag: 5, etc: 6 };

  /* ── 상태 ───────────────────────────────────────────────── */
  var state = model.restoreState({src:store('src'),cat:store('cat'),filter:store('filter'),sort:store('sort')});
  var view = [], shown = 0, PAGE = 120, lastQuery = null;
  var grid = document.getElementById('grid'), qEl = document.getElementById('q'), sortSel = document.getElementById('sortSel');
  sortSel.value = state.sort;
  function loadDataScript(src) {
    return new Promise(function(resolve,reject) {
      var tag = document.createElement('script'), done = false;
      var ref = D.catalog.parts.find(function(p){return p.path===src;});
      var brand = !ref && /^4910\/b(\d+)\.js$/.exec(src);
      if(!ref && !brand){reject(new Error('알 수 없는 데이터 경로'));return;}
      function finish(error) {
        if(done)return;done=true;clearTimeout(timer);tag.remove();
        if(error){reject(error);return;}
        var value = ref ? (window.__CLOT_CATALOG_PARTS__||{})[ref.id] : (window.__CLOT_4910_B__||{})[brand[1]];
        if(ref)delete (window.__CLOT_CATALOG_PARTS__||{})[ref.id];
        else delete (window.__CLOT_4910_B__||{})[brand[1]];
        if(!value)reject(new Error('데이터 파일 내용 없음'));else resolve(value);
      }
      var timer = setTimeout(function(){finish(new Error('데이터 요청 시간 초과'));},15000);
      tag.onload=function(){finish();};tag.onerror=function(){finish(new Error('데이터 파일 요청 실패'));};
      tag.src=src+'?v='+encodeURIComponent(D.catalog.revision);document.head.appendChild(tag);
    });
  }
  var runtime = window.__CLOT_RUNTIME_FACTORY__({model:model,baseItems:D.items,inlineHistories:D.inlineHistories,manifest:D.catalog,loadScript:loadDataScript,onChange:function(){render();}});

  var brandDialog=document.getElementById('brandDialog'),brandTrigger=document.getElementById('brandTrigger');
  var brandSearch=document.getElementById('brandSearch'),brandOptions=document.getElementById('brandOptions'),brandOptionKeys='';
  function closeBrand(){if(brandDialog.open)brandDialog.close();}
  brandTrigger.addEventListener('click',function(){brandDialog.showModal();brandOptionKeys='';renderBrandBar();brandSearch.focus();});
  document.getElementById('brandClose').addEventListener('click',closeBrand);
  brandDialog.addEventListener('close',function(){brandTrigger.focus();});
  brandDialog.addEventListener('click',function(e){
    if(e.target!==brandDialog)return;
    var r=brandDialog.getBoundingClientRect();
    if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeBrand();
  });
  brandSearch.addEventListener('input',function(){brandOptionKeys='';renderBrandBar();});
  brandOptions.addEventListener('change',function(e){
    if(!e.target.matches('input[data-brand]'))return;
    var key=e.target.dataset.brand;
    if(e.target.checked){if(!state.brandKeys.includes(key))state.brandKeys.push(key);}
    else state.brandKeys=state.brandKeys.filter(function(k){return k!==key;});
    render();
  });
  document.getElementById('brandSummary').addEventListener('click',function(e){
    var b=e.target.closest('[data-remove-brand]');if(!b)return;
    state.brandKeys=state.brandKeys.filter(function(k){return k!==b.dataset.removeBrand;});render();
  });
  function renderBrandBar(){
    if(!lastQuery)return;
    var known=new Map(runtime.getCatalog().items.map(function(x){return [x.brandKey,x.b];}));
    var selected=state.brandKeys;
    document.getElementById('brandSummary').innerHTML=selected.slice(0,2).map(function(k){
      var label=known.get(k)||k;
      return '<button class="chip" type="button" data-remove-brand="'+esc(k)+'" aria-label="'+esc(label)+' 선택 해제">'+esc(label)+' ×</button>';
    }).join('')+(selected.length>2?'<span>외 '+fmt(selected.length-2)+'개</span>':'')+
      (!selected.length?'<span class="group-label">모든 브랜드</span>':'');
    if(!brandDialog.open)return;
    var data=runtime.getCatalog();
    if(state.src!=='musinsa'&&data.status!=='ready'){

    /* U9 — 0원 시작이 아닌 동적 스케일링 */
    var yMin = Math.floor(minAll * 0.9 / 1000) * 1000;
    var yMax = Math.ceil(maxNorm * 1.05 / 1000) * 1000;

    var datasets = [
      { label: '정상가', data: normals, borderColor: cMuted, borderWidth: 1.5, borderDash: [5, 4],
        pointRadius: 0, pointHoverRadius: 0, tension: 0, fill: false },
      { label: on4910 ? '4910 표시가' : '무신사 판매가', data: sales, borderColor: cAcc, borderWidth: 2,
        pointRadius: 3, pointBackgroundColor: cAcc, pointBorderColor: cBg, pointBorderWidth: 1.5,
        pointHoverRadius: 5, tension: 0.1, fill: false },
      { label: '나의 실구매가', data: mines, borderColor: cDown, borderWidth: 3,
        tension: 0.1, fill: false,
        segment: { borderDash: function (c) { return outs[c.p1DataIndex] ? [4, 4] : undefined; } },
        pointStyle: rows.map(function (r, i) { return outs[i] ? 'crossRot' : 'circle'; }),
        pointRadius: rows.map(function (r, i) { return outs[i] ? 5 : (i === lowIdx ? 6.5 : 3.5); }),
        pointBackgroundColor: rows.map(function (r, i) { return outs[i] ? cMuted : cDown; }),
        pointBorderColor: rows.map(function (r, i) { return outs[i] ? cMuted : cBg; }),
        pointBorderWidth: rows.map(function (r, i) { return outs[i] ? 2 : 2; }),
        pointHoverRadius: 7 }
    ];
    if (it.kind === 'liked') {
      datasets.push({ label: '쿠폰적용가(신규회원)', data: newbies, borderColor: cMuted, borderWidth: 1.5,
        pointRadius: 2, pointBackgroundColor: cMuted, pointBorderWidth: 0,
        pointHoverRadius: 4, tension: 0.1, fill: false });
    }

    chart = new Chart(cv, {
      type: 'line',
      plugins: [lowestPin],
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: { duration: 260 },
        interaction: { mode: 'index', intersect: false },
        layout: { padding: { top: 30, right: 6, left: 0, bottom: 0 } },
        plugins: {
          legend: { display: false },
          lowestPin: { at: lowIdx, val: minMine, color: cDown, ink: cssVar('--fg-invert') },
          tooltip: {
            backgroundColor: cFg, titleColor: cBg, bodyColor: cBg,
            borderColor: cFg, borderWidth: 1, padding: 10, cornerRadius: 6,
            displayColors: true, boxWidth: 8, boxHeight: 8, usePointStyle: true,
            titleFont: { family: cssVar('--font'), weight: '700', size: 12 },
            bodyFont: { family: cssVar('--font'), size: 12 },
            callbacks: {
              title: function (t) {
                var i = t[0].dataIndex;
                return rows[i][0] + (outs[i] ? '  ·  품절' : '');
              },
              label: function (t) { return ' ' + t.dataset.label + '  ' + won(t.parsed.y); }
            }
          }
        },
        scales: {
          x: { grid: { display: false }, border: { color: cBorder },
               ticks: { color: cMuted, font: { family: cssVar('--font'), size: 11 }, maxRotation: 0, autoSkipPadding: 16 } },
          y: { min: yMin, max: yMax, grid: { color: cBorder, drawTicks: false },
               border: { display: false },
               ticks: { color: cMuted, font: { family: cssVar('--font'), size: 11 }, padding: 8, maxTicksLimit: 6,
                        callback: function (v) { return (v / 10000).toFixed(v % 10000 === 0 ? 0 : 1) + '만'; } } }
        }
      }
    });

  }

  function fillTable(it) {
    var tb = document.getElementById('mRows');
    if (!it.tracked) {
      tb.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:28px 0">아직 관측 기록이 없습니다</td></tr>';
      return;
    }
    var rows = slice(it).slice().reverse();
    tb.innerHTML = rows.map(function (r, i) {
      var older = rows[i + 1];
      var sameBasis = !older || !is4910(it) || r[5] === older[5];
      var d = (older && sameBasis) ? r[3] - older[3] : null;
      var dCell = d == null ? '<span class="delta-flat">—</span>'
        : d < 0 ? '<span class="delta-down num">↓ ' + Math.abs(d).toLocaleString('ko-KR') + '</span>'
        : d > 0 ? '<span class="delta-up num">↑ ' + d.toLocaleString('ko-KR') + '</span>'
        : '<span class="delta-flat">변동 없음</span>';
      var isLowRow = r[3] === it.lowMy && (!is4910(it) || r[5] === it.couponName);
      return '<tr><td>' + r[0] + '</td>' +
        '<td class="mine-c num">' + won(r[3]) + '</td>' +
        '<td>' + dCell + '</td>' +
        '<td class="num">' + won(r[2]) + '</td>' +
        '<td class="nb-col num">' + won(r.length > 7 ? r[7] : null) + '</td>' +
        '<td class="num" style="color:var(--muted)">' + won(r[1]) + '</td>' +
        '<td>' + (r[4] === 1
          ? '<span class="st">품절</span>'
          : isLowRow ? '<span class="st on">최저가</span>' : '<span class="st">판매중</span>') + '</td></tr>';
    }).join('');
  }

  /* ── 초기 렌더 + 딥링크 (기획 S9) ──────────────────────── */
  function measureHeader(){document.documentElement.style.setProperty('--topbar-height',document.querySelector('.topbar').getBoundingClientRect().height+'px');}
  measureHeader();
  if(window.ResizeObserver)new ResizeObserver(measureHeader).observe(document.querySelector('.topbar'));
  else window.addEventListener('resize',measureHeader);
  render();
  if(state.src!=='musinsa')runtime.ensureCatalog();
  var qs=new URLSearchParams(location.search);
  var dl=qs.get('goods')||(D.targetGoodsNo?String(D.targetGoodsNo):null);
  if(dl)openModal(dl);
})();
</script>
</body>
</html>
