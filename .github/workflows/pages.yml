name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - data/prices.db
      - src/dashboard.template.html
      - src/visualizer.js
      - src/dashboard-*.js
      - src/musinsaWide/point-*.js
      - scripts/verify-dashboard-build.js
      - scripts/measure-dashboard-loading.js
      - tests/**
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  # Pushes made with GITHUB_TOKEN (the Actions daily run) do not fire `push`, so follow it explicitly.
  workflow_run:
    workflows: ['Daily price tracker', '4910 tracker', '4910 full price verification', 'Musinsa wide scan', 'Musinsa point policies']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # workflow_run would otherwise check out the default-branch SHA that triggered it

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # node:sqlite

      - run: npm ci
      - name: Validate dashboard model and build
        run: node --test tests/dashboard-*.test.js tests/visualizer-data.test.js tests/visualizer-html.test.js tests/cli-visualize.test.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dashboard:browser

      # 4910.db lives in the data-4910 Release, not in git. A missing asset must not fail the deploy:
      # the build then skips the 4910 section and the Musinsa dashboard still ships.
      - name: Pull 4910.db from the data-4910 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node src/cli.js 4910-db pull || echo "::warning::4910.db not available"

      - name: Pull verified Musinsa wide snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node src/cli.js musinsa-db pull

      - name: Build dashboard from watched and wide snapshots
        env:
          CLOT_REQUIRE_MUSINSA_WIDE: '1'
          CLOT_MUSINSA_POINTS_ENABLED: ${{ vars.CLOT_MUSINSA_POINTS_ENABLED }}
        run: |
          mkdir _site
          CLOT_DASHBOARD_PATH=_site/index.html node src/cli.js visualize --no-open
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          test -s _site/index.html
          test -s _site/dashboard-worker.js
          node scripts/verify-dashboard-build.js _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
